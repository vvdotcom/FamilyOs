#
# Hometide for Fire TV (Vega OS).
# Started from the Amazon Vega sample manifest (MIT-0). Hometide plays one kind of media: the wall
# calendar's muted, looping weather landscapes, through Vega's media player (W3C Media). The sample's DRM
# and Content Launcher declarations were removed: there is no protected content and no catalog to search.
#
schema-version = 1

[os.version]
target = "1.2"
min = "1.2"

[package]
title = "Hometide"
version = "1.0.1"
id = "com.hometide.tv"
# Launcher icon on the Fire TV Home screen (512x512 PNG). Without it the tile is a gray placeholder.
icon = "@image/hometide_icon.png"

[components]
[[components.interactive]]
id = "com.hometide.tv.main"
runtime-module = "/com.amazon.kepler.keplerscript.runtime.loader_2@IKeplerScript_2_0"
launch-type = "singleton"
# Required so the app appears on and launches from the Fire TV Home screen.
categories = ["com.amazon.category.main"]

## ------------------------------------------------------------------------------
## Processes
## ------------------------------------------------------------------------------
[processes]
[[processes.group]]
component-ids = ["com.hometide.tv.main"]

## ------------------------------------------------------------------------------
## Wants - Optional capabilities
## ------------------------------------------------------------------------------
[wants]
# On-screen keyboard (pairing code, parent code)
[[wants.service]]
id = "com.amazon.inputmethod.service"

# Remote button events
[[wants.service]]
id = "com.amazon.inputd.service"

# Screen reader and other accessibility settings
[[wants.privilege]]
id = "com.amazon.devconf.privilege.accessibility"

# Network information (online/offline state)
[[wants.service]]
id = "com.amazon.network.service"

# Wall-calendar weather loops: Vega's media player and the services it runs on
[[wants.service]]
id = "com.amazon.media.server"

[[wants.service]]
id = "com.amazon.mediametrics.service"

[[wants.service]]
id = "com.amazon.media.playersession.service"

[[wants.service]]
id = "com.amazon.mediabuffer.service"

[[wants.service]]
id = "com.amazon.mediatransform.service"

[[wants.service]]
id = "com.amazon.audio.stream"

[[wants.service]]
id = "com.amazon.audio.control"

[[wants.service]]
id = "com.amazon.audio.system"

# Required by the media player's IPC (GIPC SR)
[[wants.service]]
id = "com.amazon.gipc.uuid.*"

## ------------------------------------------------------------------------------
## Needs - Required capabilities
## ------------------------------------------------------------------------------
[needs]
[[needs.privilege]]
id = "com.amazon.network.privilege.net-info"

# Media playback (the wall-calendar loops)
[[needs.privilege]]
id = "com.amazon.media.secureplayback"

[[needs.module]]
id = "/com.amazon.vega.os@IVega_1_2"

## ------------------------------------------------------------------------------
## Offers
## ------------------------------------------------------------------------------
[offers]
# Required by the media player's IPC (GIPC SR)
[[offers.service]]
id = "com.amazon.gipc.uuid.*"

[[offers.interaction]]
id = "com.hometide.tv.main"

[[offers.module]]
id = "/com.hometide.tv.main@IMod1"
includes-messages = [
    "pkg://com.hometide.tv.main"
]

## ------------------------------------------------------------------------------
## Message
## ------------------------------------------------------------------------------
[[message]]
uri = "pkg://com.hometide.tv.main"
sender-privileges = ["*"]
receiver-privileges = ["self"]
