#
# Hometide for Fire TV (Vega OS).
# Started from the Amazon Vega sample manifest (MIT-0). The sample's video, DRM, audio and Content
# Launcher declarations were removed: Hometide shows a family calendar and plays no media.
#
schema-version = 1

[os.version]
target = "1.2"
min = "1.2"

[package]
title = "Hometide"
version = "1.0.0"
id = "com.hometide.tv"

[components]
[[components.interactive]]
id = "com.hometide.tv.main"
runtime-module = "/com.amazon.kepler.keplerscript.runtime.loader_2@IKeplerScript_2_0"
launch-type = "singleton"
# Required so the app appears on and launches from the Fire TV Home screen.
categories = ["com.amazon.category.main"]

## ------------------------------------------------------------------------------
## Processes
## ------------------------------------------------------------------------------
[processes]
[[processes.group]]
component-ids = ["com.hometide.tv.main"]

## ------------------------------------------------------------------------------
## Wants - Optional capabilities
## ------------------------------------------------------------------------------
[wants]
# On-screen keyboard (pairing code, parent code)
[[wants.service]]
id = "com.amazon.inputmethod.service"

# Remote button events
[[wants.service]]
id = "com.amazon.inputd.service"

# Screen reader and other accessibility settings
[[wants.privilege]]
id = "com.amazon.devconf.privilege.accessibility"

# Network information (online/offline state)
[[wants.service]]
id = "com.amazon.network.service"

## ------------------------------------------------------------------------------
## Needs - Required capabilities
## ------------------------------------------------------------------------------
[needs]
[[needs.privilege]]
id = "com.amazon.network.privilege.net-info"

[[needs.module]]
id = "/com.amazon.vega.os@IVega_1_2"

## ------------------------------------------------------------------------------
## Offers
## ------------------------------------------------------------------------------
[offers]
[[offers.interaction]]
id = "com.hometide.tv.main"

[[offers.module]]
id = "/com.hometide.tv.main@IMod1"
includes-messages = [
    "pkg://com.hometide.tv.main"
]

## ------------------------------------------------------------------------------
## Message
## ------------------------------------------------------------------------------
[[message]]
uri = "pkg://com.hometide.tv.main"
sender-privileges = ["*"]
receiver-privileges = ["self"]
