[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "familyos-family-agent"
version = "0.1.0"
description = "Local FamilyOS API and safe briefing provider"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.40,<2",
  "cryptography>=42",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "icalendar>=6.1,<8",
  "mcp>=1.30,<2",
  "Pillow>=11,<13",
  "pypdf>=5,<7",
  "PyJWT[crypto]>=2.10,<3",
  "pydantic>=2.8,<3",
  "psycopg[binary]>=3.2,<4",
  "recurring-ical-events>=3.3,<4",
  "strands-agents>=1.10,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["migrations/*.sql", "companion/**/*", "mcp_apps/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
